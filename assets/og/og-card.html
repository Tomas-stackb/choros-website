<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>OG card — render at 1200×630</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #0d0f13; color: #f2f1ed;
    font-family: Inter, sans-serif;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 84px 84px;
    -webkit-mask-image: radial-gradient(900px 600px at 78% -10%, #000 30%, transparent 75%);
    mask-image: radial-gradient(900px 600px at 78% -10%, #000 30%, transparent 75%);
  }
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(560px 400px at 86% 2%, rgba(216,73,15,.2), transparent 62%);
  }
  .wrap { position: relative; height: 100%; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .logo { font-family: Newsreader, Georgia, serif; font-weight: 600; font-size: 40px; letter-spacing: -0.01em; }
  .logo i { display: inline-block; width: 11px; height: 11px; background: #d8490f; border-radius: 3px; margin-left: 8px; transform: translateY(-24px); }
  h1 {
    font-family: Newsreader, Georgia, serif; font-weight: 500;
    font-size: 71px; line-height: 1.06; letter-spacing: -0.018em;
    max-width: 20ch; color: #fff;
  }
  .foot { display: flex; align-items: center; justify-content: space-between; }
  .tag { font-family: "SF Mono", Menlo, monospace; font-size: 19px; letter-spacing: .14em; text-transform: uppercase; color: #a7abb3; }
  .rule { position: absolute; left: 72px; right: 72px; bottom: 148px; height: 1px; background: rgba(255,255,255,.12); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="wrap">
    <div class="logo">Choros<i></i></div>
    <h1>We build the software and AI systems that established businesses run on.</h1>
    <div class="rule"></div>
    <div class="foot">
      <div class="tag">choros.io</div>
      <div class="tag">Software &middot; AI Implementation &middot; UK</div>
    </div>
  </div>
</body>
</html>
