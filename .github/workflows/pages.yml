# Deploys a design-review preview to GitHub Pages (noindex; choros.io is not affected).
# Source files stay root-relative (production-ready for choros.io); paths are
# rewritten for the Pages sub-path and every page is marked noindex at build time.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard - published pages must not contain HTML comments
        run: |
          # Comments can leak internal notes. List file names only (never print the comment text).
          if grep -rIl --include='*.html' -e '<!--' . ; then
            echo '::error::HTML comments found in the files listed above. Remove them before publishing.'
            exit 1
          fi

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build preview
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          rsync -a --exclude '.git' --exclude '.github' --exclude '.gitignore' --exclude 'README.md' --exclude 'scripts' ./ _site/
          find _site -name '*.html' -exec sed -i -E \
            -e "s#(href|src)=\"/([^/\"]|\")#\1=\"${BASE}/\2#g" \
            -e 's#<head>#<head>\n  <meta name="robots" content="noindex, nofollow">#' {} +
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          python3 - <<'PY'
          import pathlib, re
          for p in pathlib.Path('_site').rglob('*.html'):
              t = p.read_text(encoding='utf-8'); n = re.sub(r'<!--.*?-->', '', t, flags=re.S)
              if n != t: p.write_text(n, encoding='utf-8')
          PY
          # minify at deploy time; source files stay readable
          npx --yes esbuild@0.25 _site/assets/css/main.css --minify --allow-overwrite --outfile=_site/assets/css/main.css
          npx --yes esbuild@0.25 _site/assets/js/main.js --minify --allow-overwrite --outfile=_site/assets/js/main.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
