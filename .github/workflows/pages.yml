# .github/workflows/pages.yml  (replacement) — PREVIEW ONLY.
# All preview-specific behaviour (noindex, Disallow, base path) now lives in scripts/build-site.sh preview,
# and a guard step fails the deploy if the artifact is not noindex. Production is built by Netlify/Cloudflare Pages
# running `bash scripts/build-site.sh production` (see netlify.toml), never by this workflow.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard - HTML comments must not exist in the source (they can leak internal notes)
        run: |
          if grep -rIl --include='*.html' -e '<!--' . ; then
            echo '::error::HTML comments found in the files listed above. Remove them (file names only are printed on purpose).'
            exit 1
          fi
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build preview (noindex + Disallow + base path)
        run: bash scripts/build-site.sh preview "${{ steps.pages.outputs.base_path }}"
      - name: Guard - refuse to publish anything indexable from this workflow
        run: python3 scripts/ci/check-site.py _site --mode preview --base "${{ steps.pages.outputs.base_path }}" --safety-only
      - name: Guard - refuse to run for a custom domain (that would be production)
        run: |
          if [ -f CNAME ] || [ -n "$(gh api repos/${{ github.repository }}/pages --jq '.cname // empty' 2>/dev/null)" ]; then
            echo "::error::GitHub Pages has a custom domain; this preview workflow must not deploy to it"; exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
